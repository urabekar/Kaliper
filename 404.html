<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Kaliper</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#102433" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .notfound{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    background:linear-gradient(155deg,var(--navy-deep),var(--navy));color:#eef3f7;padding:40px var(--pad)}
  .notfound-inner{max-width:560px}
  .notfound img{height:26px;width:auto;margin:0 auto 40px}
  .notfound h1{font-family:var(--display);font-weight:600;font-size:clamp(2rem,5vw,3rem);color:#fff;line-height:1.08;margin-bottom:18px}
  .notfound p{color:#bdcad6;font-size:1.08rem;margin-bottom:32px}
  .notfound .btn-ghost{color:#f3f6f9;border-color:rgba(255,255,255,.55)}
  .notfound .btn-ghost:hover{color:var(--navy-deep);background:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-inner">
      <img src="/assets/logo-white.svg" width="122" height="26" alt="Kaliper" />
      <h1>This page can't be found.</h1>
      <p>The link may be out of date, or the page may have moved.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a href="/" class="btn btn-ghost">Back to home</a>
        <a href="/#contact" class="btn btn-ghost">Contact us</a>
      </div>
    </div>
  </main>
</body>
</html>
