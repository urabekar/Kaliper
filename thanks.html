<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank you | Kaliper</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#102433" />
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="assets/fonts/lora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
<style>
  .thanks{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    background:linear-gradient(155deg,var(--navy-deep),var(--navy));color:#eef3f7;padding:40px var(--pad)}
  .thanks-inner{max-width:560px}
  .thanks img{height:26px;width:auto;margin:0 auto 40px}
  .thanks h1{font-family:var(--display);font-weight:600;font-size:clamp(2rem,5vw,3rem);color:#fff;line-height:1.08;margin-bottom:18px}
  .thanks p{color:#bdcad6;font-size:1.08rem;margin-bottom:32px}
  .thanks .btn-ghost{color:#f3f6f9;border-color:rgba(255,255,255,.55)}
  .thanks .btn-ghost:hover{color:var(--navy-deep);background:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-inner">
      <img src="assets/logo-white.svg" width="122" height="26" alt="Kaliper" />
      <h1>Thank you. Your message is in.</h1>
      <p>We've received your inquiry and sent a confirmation to your email. A partner will be in touch shortly.</p>
      <a href="/" class="btn btn-ghost">Back to home</a>
    </div>
  </main>
</body>
</html>
